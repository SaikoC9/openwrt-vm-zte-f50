name: Release OpenWrt VM

# Run workflow (Actions) builds everything from that commit and publishes a GitHub Release
# with: Image, rootfs.img.gz, cloud-hypervisor, owrt-vm.sh, owrt-vm.conf.example, owrt-kvmprobe,
# owrt-fwd (when it exists), owrt-manifest.json, SHA256SUMS. Nothing to type: the version is
# picked automatically. The first release is v1.0.0, every next one raises the patch number
# of the highest vX.Y.Z tag (v1.0.1, v1.0.2, ...). Pushing a tag vMAJOR.MINOR.PATCH by hand
# also works and uses that tag. The long part is the OpenWrt guest build (about 1 hour).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            # highest vX.Y.Z tag; none (or only 0.x) -> first release 1.0.0, else patch + 1
            last=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$last" ] || [ "${last%%.*}" = 0 ]; then
              v=1.0.0
            else
              v="${last%.*}.$(( ${last##*.} + 1 ))"
            fi
          fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "bad version '$v' (want MAJOR.MINOR.PATCH)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Script tests
        run: |
          bash scripts/test_owrt_build.sh
          bash scripts/test_owrt_release.sh
          bash scripts/test_guest.sh
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-system-arm curl
      - name: Build tools and host
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bash scripts/owrt-build.sh --version "$VERSION" --out dist/owrt tools host
          bash scripts/owrt-build.sh --verify dist/owrt
      - name: Work folder on the big disk
        run: |
          sudo mkdir -p /mnt/owrt-work && sudo chown "$USER" /mnt/owrt-work
          df -h / /mnt
      - name: Build guest
        env:
          OWRT_GUEST_WORK: /mnt/owrt-work
        run: bash scripts/owrt-build.sh guest --out dist/guest
      - name: Boot in QEMU, ask LuCI
        run: bash scripts/owrt-qemu-smoke.sh --dir dist/guest --require --luci --timeout 600
      - name: Assemble release folder
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/owrt-release.sh --version "$VERSION" --tools dist/owrt --guest dist/guest --out dist/release
      - name: Summary
        run: |
          {
            echo "## Release ${{ steps.ver.outputs.version }}"
            echo '```'; cat dist/release/SHA256SUMS; echo '```'
            echo "Plugin pin, sha256 of owrt-manifest.json: \`$(sha256sum dist/release/owrt-manifest.json | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: owrt-release
          path: dist/release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # create the release
      actions: read     # download the artifact of this run
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the built folder
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n owrt-release -D dist/release
      - name: Verify before publishing
        run: bash scripts/owrt-release.sh --verify dist/release --version "$VERSION"
      - name: Release notes
        run: |
          pin=$(sha256sum dist/release/owrt-manifest.json | cut -d' ' -f1)
          {
            echo "OpenWrt $VERSION guest for the F50, built from tag $TAG ($GITHUB_SHA)."
            echo
            echo "Plugin pin (sha256 of owrt-manifest.json): \`$pin\`"
            echo
            echo "Verify on a PC, no checkout needed:"
            echo
            echo '```'
            echo "mkdir owrt-$VERSION && cd owrt-$VERSION"
            echo "gh release download $TAG --repo $GITHUB_REPOSITORY"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } > dist/notes.md
          cat dist/notes.md
      - name: Create the release
        run: |
          gh release create "$TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenWrt VM $TAG" --notes-file dist/notes.md
      - name: Download the published assets and verify them
        run: |
          mkdir -p dist/check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D dist/check
          ( cd dist/check && sha256sum -c SHA256SUMS )
          bash scripts/owrt-release.sh --verify dist/check --version "$VERSION"
          cmp dist/check/owrt-manifest.json dist/release/owrt-manifest.json
          echo "published release $TAG verified: $(ls dist/check | wc -l) assets"
