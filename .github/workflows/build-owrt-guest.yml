name: Build OpenWrt guest (Image + rootfs.img)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Script tests
        run: |
          bash scripts/test_owrt_build.sh
          bash scripts/test_guest.sh
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-system-arm curl
      - name: Work folder on the big disk
        run: |
          sudo mkdir -p /mnt/owrt-work && sudo chown "$USER" /mnt/owrt-work
          df -h / /mnt
      - name: Build guest
        env:
          OWRT_GUEST_WORK: /mnt/owrt-work
        run: bash scripts/owrt-build.sh guest --out dist/guest
      - name: Boot in QEMU, ask LuCI
        run: bash scripts/owrt-qemu-smoke.sh --dir dist/guest --require --luci --timeout 600
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: owrt-guest-arm64
          path: |
            dist/guest/
            !dist/guest/.owrt-out
