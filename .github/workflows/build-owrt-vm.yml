name: Build OpenWrt VM tools (arm64)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/owrt-*/**"
      - "host/**"
      - "guest/**"
      - "scripts/**"
      - ".github/workflows/build-owrt-vm.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.10"
          cache: false
      - name: Script tests
        run: |
          bash scripts/test_owrt_build.sh
          bash scripts/test_owrt_vm.sh
          bash scripts/test_owrt_install.sh
          node scripts/sync_plugin.js --check
          node tests/test_plugin.js
          bash scripts/test_guest.sh
      - name: Cross linker (fallback for the VMM link step)
        run: sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build
        run: bash scripts/owrt-build.sh --version "${GITHUB_SHA::12}" tools host
      - name: Verify manifest
        run: bash scripts/owrt-build.sh --verify dist/owrt
      - name: Summary
        run: |
          { echo "## owrt tools"; echo '```'; cat dist/owrt/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: owrt-vm-arm64
          path: |
            dist/owrt/
            !dist/owrt/.owrt-out
